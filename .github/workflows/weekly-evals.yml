name: weekly-evals

on:
  schedule: [{ cron: "0 9 * * 1" }]   # Mondays 09:00 UTC
  workflow_dispatch:

jobs:
  evals:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        model: ["llama3.1:8b", "deepseek-r1:1.5b"]

    steps:
      - uses: actions/checkout@v4

      - name: Compute safe model slug
        id: names
        shell: bash
        run: |
          RAW="${{ matrix.model }}"
          # Replace characters disallowed in artifact/file names with '-'
          SAFE="${RAW//[:\/\\\"<>|*? ]/-}"
          echo "safe_model=$SAFE" >> "$GITHUB_OUTPUT"

      - name: Install deps
        run: python -m pip install --upgrade pip && pip install requests PyYAML

      - name: Run evals
        env:
          ENDPOINT: https://doggo-gpt-mini-api.com/chat_json
          MODEL: ${{ matrix.model }}
          SAFE_MODEL: ${{ steps.names.outputs.safe_model }}
        run: |
            mkdir -p out
            python eval_runner.py \
            --cases cases.yaml \
            --out "out/eval-${SAFE_MODEL}.md" \
            --endpoint "$ENDPOINT" \
            --model "$MODEL" \
            --min-pass 0.90 \
            --max-p95 2500 \
            --client-timeout 180

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: evals-${{ steps.names.outputs.safe_model }}
          path: out/eval-${{ steps.names.outputs.safe_model }}.md
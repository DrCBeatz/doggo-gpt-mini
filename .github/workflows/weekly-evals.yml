name: weekly-evals

on:
  schedule: [{ cron: "0 3 * * 2" }]   # Tuesdays 03:00 UTC
  workflow_dispatch:

jobs:
  evals:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        include:
        - model: "llama3.1:8b"
          max_p95: 10000
        - model: "deepseek-r1:1.5b"
          max_p95: 19000

    steps:
      - uses: actions/checkout@v4

      - name: Compute safe model slug
        id: names
        shell: bash
        run: |
          RAW="${{ matrix.model }}"
          SAFE="${RAW//[:\/\\\"<>|*? ]/-}"
          echo "safe_model=$SAFE" >> "$GITHUB_OUTPUT"

      - name: Install deps
        run: python -m pip install --upgrade pip && pip install requests PyYAML

      - name: Run evals
        env:
          ENDPOINT: https://doggo-gpt-mini-api.com/chat_json
          MODEL: ${{ matrix.model }}
          SAFE_MODEL: ${{ steps.names.outputs.safe_model }}
        run: |
          set -e
          mkdir -p out
          set +e
          python eval_runner.py \
            --cases cases.yaml \
            --out "out/eval-${SAFE_MODEL}.md" \
            --endpoint "$ENDPOINT" \
            --model "$MODEL" \
            --min-pass 0.90 \
            --max-p95 "${{ matrix.max_p95 }}" \
            --client-timeout 180
          status=$?
          echo "----- EVAL REPORT (eval-${SAFE_MODEL}.md) -----"
          cat "out/eval-${SAFE_MODEL}.md" || true
          exit $status

      - name: Add report to Job Summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Weekly evals — ${{ matrix.model }}";
            echo;
            echo "<details><summary>Open full report</summary>";
            echo;
            if [[ -f "out/eval-${{ steps.names.outputs.safe_model }}.md" ]]; then
              sed -E 's/^# /### /' "out/eval-${{ steps.names.outputs.safe_model }}.md"
            else
              echo "_No report file found._"
            fi
            echo;
            echo "</details>";
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evals-${{ steps.names.outputs.safe_model }}
          path: out/eval-${{ steps.names.outputs.safe_model }}.md
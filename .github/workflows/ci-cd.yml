# .github/workflows/ci-cd.yml

# This workflow will build a docker image, 
# run tests, and deploy the frontend to S3

name: CI/CD Workflow

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      docker:
        image: docker:19.03.12
        options: --privileged
        ports:
          - 2375:2375
        env:
          DOCKER_TLS_CERTDIR: ""

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build and push Docker images
        run: |
          docker compose -f docker-compose.yml build

      - name: Run tests
        run: |
          docker compose -f docker-compose.yml up -d
          docker compose exec flask-app pytest --maxfail=1 --disable-warnings -q
        env:
          OLLAMA_API_URL: http://ollama:11434
          MODEL_NAME: llama3.1:8b

      - name: Smoke test metrics endpoint
        run: |
          docker compose exec -T flask-app sh -lc \
            "curl -s -X POST http://localhost/chat_json \
              -d 'message=hi' -d 'direction=eng_to_doggo' \
              -d 'model=${MODEL_NAME:-llama3.1:8b}' >/dev/null || true"

          docker compose exec -T flask-app sh -lc \
            "curl -s http://localhost/metrics | grep -E '^(doggo_requests_total|doggo_request_latency_seconds_count)'"

      - name: Shut down Docker containers
        run: docker compose down
      
      - name: Sync site to S3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: jakejarvis/s3-sync-action@v0.5.1
        with:
          args: --delete --cache-control=max-age=0,no-cache,no-store,must-revalidate
        env:
          AWS_S3_BUCKET: doggo-gpt-mini-s3
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: us-east-2
          SOURCE_DIR: public